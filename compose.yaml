services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: relayforge
      POSTGRES_USER: relayforge
      POSTGRES_PASSWORD: relayforge
    ports:
      - "5432:5432"
    volumes:
      - relayforge-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relayforge -d relayforge"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  relayforge-postgres:
